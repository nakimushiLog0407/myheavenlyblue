<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻訳の本棚</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500&family=Noto+Sans+KR:wght@300;400&family=DM+Serif+Display:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8f4;
    --bg2: #fef3ec;
    --white: #ffffff;
    --pink: #f5c6d0;
    --pink-deep: #e8a0b0;
    --mint: #c4e8df;
    --mint-deep: #8ecfc3;
    --lavender: #ddd0f0;
    --lavender-deep: #b8a0d8;
    --yellow: #fce9c0;
    --yellow-deep: #f0cc80;
    --blue: #c8dff5;
    --blue-deep: #90bce8;
    --peach: #fdd8c4;
    --peach-deep: #f0a880;
    --ink: #3a2e2a;
    --ink-mid: #7a6858;
    --ink-light: #b0a090;
    --shadow: rgba(180,140,120,0.13);
    --shelf-bg: #f0e8e0;
    --shelf-plank: #ddd0c4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Zen Maru Gothic', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== BACKGROUND ===== */
  .bg-decor {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.3;
  }
  .blob1 { width: 500px; height: 500px; background: var(--pink); top: -150px; right: -100px; }
  .blob2 { width: 400px; height: 400px; background: var(--mint); bottom: 0px; left: -100px; }
  .blob3 { width: 300px; height: 300px; background: var(--lavender); top: 45%; left: 35%; }
  .dots-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(circle, rgba(180,140,120,0.07) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  /* ===== LAYOUT ===== */
  .page-wrap {
    position: relative;
    z-index: 1;
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 32px 80px;
  }

  /* ===== HEADER ===== */
  .header {
    padding: 28px 0 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid rgba(180,140,120,0.2);
    margin-bottom: 24px;
    animation: fadeUp 0.5s ease both;
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: var(--ink-light);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid rgba(180,140,120,0.25);
    background: var(--white);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .back-btn:hover { background: var(--pink); color: var(--ink); border-color: var(--pink-deep); }
  .header-title-wrap { flex: 1; }
  .header h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-style: normal;
    font-size: 1.7rem;
    color: var(--ink);
    letter-spacing: 0.04em;
    line-height: 1.1;
  }
  .header h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--pink-deep), var(--lavender-deep));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-sub {
    font-size: 0.62rem;
    color: var(--ink-light);
    letter-spacing: 0.12em;
    margin-top: 3px;
  }
  .header-stats {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: var(--white);
    border-radius: 20px;
    padding: 6px 14px;
    box-shadow: 0 2px 8px var(--shadow);
    text-align: center;
    min-width: 80px;
  }
  .stat-pill .val {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink);
    display: block;
  }
  .stat-pill .lbl {
    font-size: 0.55rem;
    color: var(--ink-light);
    letter-spacing: 0.1em;
    display: block;
  }
  .streak-pill {
    background: var(--yellow);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.7rem;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 2px 8px var(--shadow);
  }

  /* ===== OVERALL PROGRESS ===== */
  .overall-bar-section {
    margin-bottom: 20px;
    animation: fadeUp 0.5s 0.05s ease both;
  }
  .overall-bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .overall-label {
    font-size: 0.6rem;
    letter-spacing: 0.14em;
    color: var(--ink-light);
    white-space: nowrap;
  }
  .overall-track {
    flex: 1;
    height: 8px;
    background: rgba(180,140,120,0.15);
    border-radius: 4px;
    overflow: hidden;
  }
  .overall-fill {
    height: 100%;
    background: linear-gradient(to right, var(--pink-deep), var(--lavender-deep));
    border-radius: 4px;
    transition: width 0.8s ease;
  }
  .overall-pct {
    font-size: 0.68rem;
    color: var(--pink-deep);
    font-weight: 500;
    white-space: nowrap;
  }

  /* ===== CONTROLS ===== */
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 28px;
    animation: fadeUp 0.5s 0.1s ease both;
    flex-wrap: wrap;
  }
  .btn {
    padding: 7px 18px;
    border-radius: 20px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid;
  }
  .btn-primary {
    background: var(--pink);
    border-color: var(--pink-deep);
    color: var(--ink);
  }
  .btn-primary:hover { background: var(--pink-deep); }
  .btn-secondary {
    background: var(--white);
    border-color: rgba(180,140,120,0.3);
    color: var(--ink-mid);
  }
  .btn-secondary:hover { background: var(--bg2); }

  /* ===== BOOKSHELF ===== */
  .shelves-wrap {
    animation: fadeUp 0.5s 0.15s ease both;
  }
  .shelf-row {
    margin-bottom: 8px;
  }
  .books-row {
    background: linear-gradient(to bottom, rgba(240,232,224,0.4), rgba(240,232,224,0.1));
    padding: 18px 24px 0;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    min-height: 130px;
    flex-wrap: nowrap;
    border-radius: 12px 12px 0 0;
  }
  .shelf-plank {
    height: 14px;
    background: linear-gradient(to bottom, var(--shelf-plank), #c8bab0);
    border-radius: 0 0 6px 6px;
    box-shadow: 0 4px 10px rgba(180,140,120,0.25);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 14px;
  }
  .shelf-plank::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: rgba(255,255,255,0.5);
    border-radius: 2px 2px 0 0;
  }
  .shelf-number {
    font-size: 0.5rem;
    color: rgba(100,80,60,0.5);
    letter-spacing: 0.12em;
  }

  /* ===== BOOK ===== */
  .book {
    cursor: pointer;
    position: relative;
    transition: transform 0.22s ease;
    transform-origin: bottom center;
    flex-shrink: 0;
  }
  .book:hover { transform: translateY(-10px); }

  .book-spine {
    border-radius: 3px 2px 2px 3px;
    position: relative;
    overflow: hidden;
    box-shadow: 2px 0 8px rgba(180,140,120,0.3), inset -2px 0 4px rgba(0,0,0,0.06);
    transition: box-shadow 0.2s;
  }
  .book:hover .book-spine {
    box-shadow: 3px 0 14px rgba(180,140,120,0.45), inset -2px 0 4px rgba(0,0,0,0.06);
  }
  .book-spine::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: rgba(255,255,255,0.35);
    border-radius: 3px 0 0 3px;
  }

  /* progress fill from bottom */
  .book-fill {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    transition: height 0.6s ease;
    opacity: 0.85;
  }

  .book-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    z-index: 2;
    padding: 4px 2px;
  }
  .book-title-text {
    writing-mode: vertical-rl;
    font-size: 0.45rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: rgba(40,30,20,0.7);
    text-shadow: 0 1px 2px rgba(255,255,255,0.6);
    overflow: hidden;
    max-height: 72%;
    white-space: nowrap;
  }
  .book-num {
    font-size: 0.38rem;
    color: rgba(40,30,20,0.45);
    writing-mode: horizontal-tb;
  }

  /* ===== TOOLTIP ===== */
  .book-tooltip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--white);
    border: 1px solid rgba(180,140,120,0.2);
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 0.6rem;
    color: var(--ink);
    white-space: nowrap;
    z-index: 100;
    box-shadow: 0 4px 18px var(--shadow);
    pointer-events: none;
    line-height: 1.8;
  }
  .book-tooltip::after {
    content: '';
    position: absolute;
    top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: rgba(180,140,120,0.2);
  }
  .book:hover .book-tooltip { display: block; }
  .tooltip-title { font-weight: 500; color: var(--ink); margin-bottom: 2px; }
  .tooltip-pct { color: var(--pink-deep); font-weight: 500; }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-light);
    font-size: 0.8rem;
    line-height: 2.2;
    background: var(--white);
    border-radius: 20px;
    box-shadow: 0 2px 16px var(--shadow);
  }
  .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }

  /* ===== BADGES ===== */
  .badges-section {
    margin-top: 36px;
    animation: fadeUp 0.5s 0.25s ease both;
  }
  .section-label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--ink-light);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, rgba(180,140,120,0.3), transparent);
  }
  .badges-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .badge.locked {
    background: var(--bg2);
    color: var(--ink-light);
    border: 1px dashed rgba(180,140,120,0.3);
  }
  .badge.unlocked {
    background: var(--yellow);
    color: var(--ink);
    border: 1px solid var(--yellow-deep);
    box-shadow: 0 2px 8px rgba(240,200,100,0.25);
  }

  /* ===== MODALS ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(58,46,42,0.35);
    z-index: 200;
    backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  /* Chapter detail modal */
  .chapter-modal {
    background: var(--white);
    width: 100%;
    max-width: 920px;
    max-height: 90vh;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(58,46,42,0.18);
    overflow: hidden;
    animation: modalPop 0.25s ease both;
  }
  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.96) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .chapter-modal-header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid rgba(180,140,120,0.15);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    background: linear-gradient(to right, #fef8f4, var(--white));
  }
  .chapter-badge {
    background: var(--pink);
    color: var(--ink);
    font-size: 0.6rem;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .chapter-title-input {
    flex: 1;
    border: none;
    border-bottom: 1.5px solid rgba(180,140,120,0.2);
    background: transparent;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px;
    color: var(--ink);
    padding: 3px 6px;
    outline: none;
    transition: border-color 0.2s;
  }
  .chapter-title-input:focus { border-bottom-color: var(--pink-deep); }
  .chapter-title-input::placeholder { color: var(--ink-light); }
  .modal-close-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid rgba(180,140,120,0.2);
    background: var(--bg2);
    color: var(--ink-mid);
    font-size: 0.75rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .modal-close-btn:hover { background: var(--pink); }

  .chapter-modal-meta {
    padding: 10px 22px;
    border-bottom: 1px solid rgba(180,140,120,0.12);
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    flex-shrink: 0;
    background: var(--bg);
  }
  .meta-item { display: flex; flex-direction: column; gap: 2px; }
  .meta-lbl { font-size: 0.52rem; letter-spacing: 0.12em; color: var(--ink-light); }
  .meta-val { font-size: 0.82rem; color: var(--ink); font-weight: 500; }
  .meta-inp {
    padding: 4px 8px;
    border: 1px solid rgba(180,140,120,0.25);
    border-radius: 8px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px;
    color: var(--ink);
    width: 90px;
    outline: none;
    background: var(--white);
  }
  .meta-inp:focus { border-color: var(--pink-deep); }
  .meta-progress { flex: 1; min-width: 160px; }
  .meta-progress-track {
    height: 7px;
    background: rgba(180,140,120,0.15);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
  }
  .meta-progress-fill {
    height: 100%;
    background: linear-gradient(to right, var(--pink-deep), var(--lavender-deep));
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .meta-pct { font-size: 0.68rem; color: var(--pink-deep); font-weight: 500; padding-top: 6px; white-space: nowrap; }

  .chapter-modal-editors {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .editor-pane {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex: 1;
  }
  .editor-header {
    padding: 7px 16px;
    background: var(--bg2);
    border-bottom: 1px solid rgba(180,140,120,0.12);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 6px;
  }
  .editor-lang {
    font-size: 0.58rem;
    letter-spacing: 0.14em;
    color: var(--ink-light);
  }
  .editor-counts {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .editor-count-item {
    font-size: 0.58rem;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .editor-count-item .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .dot-korean { background: var(--mint-deep); }
  .dot-japanese { background: var(--pink-deep); }
  .editor-count-item .num { color: var(--ink-mid); }
  .editor-textarea {
    flex: 1;
    padding: 18px 20px;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Noto Sans KR', 'Zen Maru Gothic', sans-serif;
    font-size: 16px; /* 16px以上でiOSの自動ズームを防止 */
    line-height: 2.2;
    color: var(--ink);
    background: var(--white);
    overflow-y: auto;
    min-height: 320px;
  }

  .chapter-modal-footer {
    padding: 12px 22px;
    border-top: 1px solid rgba(180,140,120,0.15);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    background: var(--bg);
  }
  .footer-note { margin-left: auto; font-size: 0.58rem; color: var(--ink-light); font-style: italic; }

  /* Small modal (add/bulk) */
  .small-modal {
    background: var(--white);
    width: 100%;
    max-width: 360px;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(58,46,42,0.18);
    animation: modalPop 0.25s ease both;
  }
  .small-modal h3 {
    font-size: 0.9rem;
    margin-bottom: 20px;
    color: var(--ink);
    letter-spacing: 0.04em;
  }
  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block;
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    color: var(--ink-light);
    margin-bottom: 5px;
  }
  .form-input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid rgba(180,140,120,0.3);
    border-radius: 10px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px;
    color: var(--ink);
    outline: none;
    background: var(--white);
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--pink-deep); }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

  /* ===== 完成モード ===== */
  .completed-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--mint);
    color: var(--ink-mid);
    border: 1px solid var(--mint-deep);
  }
  .finished-view {
    flex: 1;
    padding: 28px 32px;
    overflow-y: auto;
    background: var(--white);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px;
    line-height: 2.4;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-all;
    display: none;
  }
  .finished-view.active { display: block; }
  .editor-textarea.hidden { display: none; }
  /* 完成した本：背表紙上部に小さな光沢ライン */
  .book-spine.completed::after {
    content: '✦';
    position: absolute;
    top: 5px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.45rem;
    color: rgba(255,255,255,0.9);
    z-index: 3;
    text-shadow: 0 0 4px rgba(255,255,255,0.8);
  }
  .book-spine.completed {
    box-shadow: 2px 0 10px rgba(180,140,120,0.4), inset -2px 0 4px rgba(0,0,0,0.06), inset 0 0 12px rgba(255,255,255,0.15);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(180,140,120,0.3); border-radius: 3px; }

  @media (max-width: 600px) {
    .page-wrap { padding: 0 16px 60px; }
    .header { flex-wrap: wrap; }
    .header-stats { width: 100%; }
    .chapter-modal-editors { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .editor-pane { border-right: none; border-bottom: 1px solid rgba(180,140,120,0.15); }
  }
</style>
</head>
<body>

<div class="bg-decor">
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>
</div>
<div class="dots-bg"></div>

<div class="page-wrap">

  <!-- HEADER -->
  <div class="header">
    <a class="back-btn" href="../index.html">← ホームへ</a>
    <div class="header-title-wrap">
      <h1>翻訳の <em>本棚</em></h1>
      <div class="header-sub">TRANSLATION TRACKER</div>
    </div>
    <div class="header-stats">
      <div class="stat-pill">
        <span class="val" id="totalTranslated">0</span>
        <span class="lbl">翻訳済み文字数</span>
      </div>
      <div class="stat-pill">
        <span class="val" id="bunkoCount">0</span>
        <span class="lbl">文庫本換算（冊）</span>
      </div>
      <div class="streak-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex-shrink:0"><path d="M12 2c0 6-6 7-6 12a6 6 0 0 0 12 0c0-5-6-6-6-12z"/><path d="M12 12c0 3-2 4-2 6a2 2 0 0 0 4 0c0-2-2-3-2-6z"/></svg> <span id="streakDays">0</span> 日連続</div>
    </div>
  </div>

  <!-- OVERALL PROGRESS -->
  <div class="overall-bar-section">
    <div class="overall-bar-row">
      <div class="overall-label">TOTAL PROGRESS</div>
      <div class="overall-track">
        <div class="overall-fill" id="overallBar" style="width:0%"></div>
      </div>
      <div class="overall-pct" id="overallPct">0%</div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="btn btn-primary" onclick="openAddModal()" style="display:flex;align-items:center;gap:5px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="width:13px;height:13px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 章を追加</button>
    <button class="btn btn-secondary" onclick="openBulkAddModal()" style="display:flex;align-items:center;gap:5px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><rect x="3" y="3" width="4" height="18" rx="1"/><rect x="9" y="7" width="4" height="14" rx="1"/><rect x="15" y="5" width="4" height="16" rx="1"/><line x1="2" y1="21" x2="22" y2="21"/></svg> まとめて追加</button>
    <button class="btn btn-secondary" onclick="exportData()" style="margin-left:auto;display:flex;align-items:center;gap:5px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> エクスポート</button>
    <button class="btn btn-secondary" onclick="document.getElementById('importInput').click()" style="display:flex;align-items:center;gap:5px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> インポート</button>
    <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importData(event)" />
  </div>

  <!-- SHELVES -->
  <div class="shelves-wrap" id="shelvesContainer"></div>

  <!-- BADGES -->
  <div class="badges-section">
    <div class="section-label">Milestones</div>
    <div class="badges-row" id="badgesRow"></div>
  </div>

</div>

<!-- ===== CHAPTER MODAL ===== -->
<div class="modal-overlay" id="chapterModal">
  <div class="chapter-modal">
    <div class="chapter-modal-header">
      <div class="chapter-badge" id="modalChapterBadge">第1章</div>
      <input class="chapter-title-input" id="modalTitleInput" placeholder="章タイトルを入力…" />
      <button class="modal-close-btn" onclick="closeChapterModal()">✕</button>
    </div>
    <div class="chapter-modal-meta">
      <div class="meta-item">
        <div class="meta-lbl">原文字数（自動）</div>
        <div class="meta-val" id="modalTargetChars">— 字</div>
      </div>
      <div class="meta-item">
        <div class="meta-lbl">翻訳済み</div>
        <div class="meta-val" id="modalTranslatedCount">0 字</div>
      </div>
      <div class="meta-progress">
        <div class="meta-lbl">進捗（韓国語→日本語）</div>
        <div class="meta-progress-track">
          <div class="meta-progress-fill" id="modalProgressFill" style="width:0%"></div>
        </div>
      </div>
      <div class="meta-pct" id="modalPctText">0%</div>

    <div class="chapter-modal-editors">
      <div class="editor-pane">
        <div class="editor-header">
          <span class="editor-lang" id="editorLangLabel">원문을 붙여넣고, 위에 번역문을 덮어쓰세요</span>
          <div class="editor-counts" id="editorCounts">
            <div class="editor-count-item">
              <span class="dot dot-korean"></span>
              <span>韓国語</span>
              <span class="num" id="koreanCount">0 字</span>
            </div>
            <div class="editor-count-item">
              <span class="dot dot-japanese"></span>
              <span>日本語</span>
              <span class="num" id="japaneseCount">0 字</span>
            </div>
          </div>
        </div>
        <textarea class="editor-textarea" id="editorText" placeholder="원문을 붙여넣으세요. 그런 다음 번역문으로 덮어쓰세요…"></textarea>
        <div class="finished-view" id="finishedView"></div>
      </div>
    </div>
    <div class="chapter-modal-footer">
      <button class="btn btn-primary" id="saveBtn" onclick="saveChapter()">保存</button>
      <button class="btn btn-secondary" onclick="closeChapterModal()">閉じる</button>
      <button class="btn btn-secondary" id="completeBtn" onclick="markComplete()" style="border-color:var(--mint-deep);color:var(--mint-deep);display:flex;align-items:center;gap:5px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><path d="M20 6L9 17l-5-5"/></svg> 翻訳完成</button>
      <button class="btn btn-secondary" id="editModeBtn" onclick="switchToEditMode()" style="display:none;">編集に戻る</button>
      <div class="footer-note">原文貼り付け時に目標文字数を自動設定 · 日本語の割合で進捗を計算</div>
    </div>
  </div>
</div>

<!-- ===== ADD MODAL ===== -->
<div class="modal-overlay" id="addModal">
  <div class="small-modal">
    <h3>章を追加</h3>
    <div class="form-group">
      <label class="form-label">章番号</label>
      <input class="form-input" id="newChapterNum" type="number" placeholder="1" min="1" />
    </div>
    <div class="form-group">
      <label class="form-label">章タイトル（任意）</label>
      <input class="form-input" id="newChapterTitle" placeholder="タイトルなし" />
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeAddModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="addChapter()">追加</button>
    </div>
  </div>
</div>

<!-- ===== BULK MODAL ===== -->
<div class="modal-overlay" id="bulkModal">
  <div class="small-modal">
    <h3>まとめて追加</h3>
    <div class="form-group">
      <label class="form-label">開始章番号</label>
      <input class="form-input" id="bulkStart" type="number" value="1" />
    </div>
    <div class="form-group">
      <label class="form-label">終了章番号</label>
      <input class="form-input" id="bulkEnd" type="number" value="10" />
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeBulkModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="bulkAddChapters()">追加</button>
    </div>
  </div>
</div>

<script>
// ===== DATA =====
const STORAGE_KEY = 'translationTracker_v1';
function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { chapters: [], streak: 0, lastActivity: null }; }
  catch(e) { return { chapters: [], streak: 0, lastActivity: null }; }
}
function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
let data = loadData();
let currentChapterId = null;

// ===== BOOK COLORS (pastel palette) =====
const BOOK_COLORS = [
  { base: '#f5c6d0', fill: '#e8a0b0' }, // pink
  { base: '#c4e8df', fill: '#8ecfc3' }, // mint
  { base: '#ddd0f0', fill: '#b8a0d8' }, // lavender
  { base: '#fce9c0', fill: '#f0cc80' }, // yellow
  { base: '#c8dff5', fill: '#90bce8' }, // blue
  { base: '#fdd8c4', fill: '#f0a880' }, // peach
];

function getBookBaseColor(idx) {
  return BOOK_COLORS[idx % BOOK_COLORS.length];
}

function getBookWidth(idx) {
  const ws = [22, 26, 20, 28, 24, 19, 27, 21, 25, 23];
  return ws[idx % ws.length];
}

// ===== RENDER =====
function calcBooksPerShelf() {
  // コンテナ幅から1段あたりの冊数を動的に計算
  const container = document.getElementById('shelvesContainer');
  const containerWidth = container.offsetWidth || window.innerWidth - 64;
  const shelfWidth = containerWidth - 48; // padding分を引く
  const avgBookWidth = 24 + 4; // 平均本幅 + gap
  return Math.max(5, Math.floor(shelfWidth / avgBookWidth));
}

function renderShelves() {
  const container = document.getElementById('shelvesContainer');
  if (data.chapters.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="width:52px;height:52px;color:var(--ink-light)"><rect x="8" y="10" width="8" height="24" rx="1.5"/><rect x="20" y="16" width="8" height="18" rx="1.5"/><rect x="32" y="13" width="8" height="21" rx="1.5"/><line x1="4" y1="38" x2="44" y2="38"/></svg></div>
        本棚が空です。<br>「＋ 章を追加」から始めましょう。
      </div>`;
    updateStats();
    return;
  }

  const booksPerShelf = calcBooksPerShelf();
  const sorted = [...data.chapters].sort((a,b) => a.num - b.num);
  const shelves = [];
  for (let i = 0; i < sorted.length; i += booksPerShelf) {
    shelves.push(sorted.slice(i, i + booksPerShelf));
  }

  container.innerHTML = '';
  shelves.forEach((shelfBooks, si) => {
    const shelfDiv = document.createElement('div');
    shelfDiv.className = 'shelf-row';

    const booksRow = document.createElement('div');
    booksRow.className = 'books-row';

    shelfBooks.forEach((ch, bi) => {
      const globalIdx = si * booksPerShelf + bi;
      const pct = ch.targetChars > 0
        ? Math.min(100, Math.round(ch.translatedChars / ch.targetChars * 100))
        : 0;
      const color = getBookBaseColor(globalIdx);
      const width = getBookWidth(globalIdx);
      const height = 90 + (ch.num % 5) * 5;

      const titleShort = ch.title
        ? (ch.title.length > 6 ? ch.title.slice(0,6) + '…' : ch.title)
        : `第${ch.num}章`;

      const book = document.createElement('div');
      book.className = 'book';
      book.onclick = () => openChapterModal(ch.id);

      book.innerHTML = `
        <div class="book-spine${ch.completed ? ' completed' : ''}" style="width:${width}px;height:${height}px;background:${color.base};">
          <div class="book-fill" style="height:${pct}%;background:${color.fill};"></div>
          <div class="book-label">
            <div class="book-title-text">${titleShort}</div>
            <div class="book-num">${ch.num}</div>
          </div>
        </div>
        <div class="book-tooltip">
          <div class="tooltip-title">${ch.title || `第${ch.num}章`}${ch.completed ? ' ✦' : ''}</div>
          <div>${ch.translatedChars.toLocaleString()} / ${ch.targetChars.toLocaleString()} 字</div>
          <div class="tooltip-pct">${ch.completed ? '翻訳完成' : pct + '% 完了'}</div>
        </div>
      `;
      booksRow.appendChild(book);
    });

    const plank = document.createElement('div');
    plank.className = 'shelf-plank';
    plank.innerHTML = `<span class="shelf-number">SHELF ${si + 1}</span>`;

    shelfDiv.appendChild(booksRow);
    shelfDiv.appendChild(plank);
    container.appendChild(shelfDiv);
  });

  updateStats();
  renderBadges();
}

// ===== STATS =====
function updateStats() {
  const totalTarget = data.chapters.reduce((s,c) => s + c.targetChars, 0);
  const totalDone   = data.chapters.reduce((s,c) => s + c.translatedChars, 0);
  const pct = totalTarget > 0 ? Math.min(100, (totalDone / totalTarget * 100).toFixed(1)) : 0;
  document.getElementById('totalTranslated').textContent = totalDone.toLocaleString();
  document.getElementById('bunkoCount').textContent = (totalDone / 100000).toFixed(1);
  document.getElementById('overallBar').style.width = pct + '%';
  document.getElementById('overallPct').textContent = pct + '%';
  document.getElementById('streakDays').textContent = data.streak || 0;
}

// ===== BADGES =====
const SVG_BOOK     = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"><path d="M2 6s1.5-2 5-2 5 2 5 2v14s-1.5-1-5-1-5 1-5 1V6z"/><path d="M12 6s1.5-2 5-2 5 2 5 2v14s-1.5-1-5-1-5 1-5 1V6z"/></svg>`;
const SVG_BOOKS    = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"><rect x="3" y="3" width="4" height="18" rx="1"/><rect x="9" y="7" width="4" height="14" rx="1"/><rect x="15" y="5" width="4" height="16" rx="1"/><line x1="2" y1="21" x2="22" y2="21"/></svg>`;
const SVG_MEDAL    = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"><circle cx="12" cy="15" r="5"/><path d="M9 3h6l2 4-5 3-5-3 2-4z"/></svg>`;
const SVG_STAR     = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>`;
const SVG_STAR2    = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/><circle cx="12" cy="12" r="2"/></svg>`;
const SVG_TROPHY   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"><path d="M6 3h12v8a6 6 0 0 1-12 0V3z"/><path d="M6 7H3a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4"/><path d="M18 7h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"/><line x1="9" y1="21" x2="15" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`;
const SVG_LOCK     = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0;opacity:0.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;

const MILESTONES = [
  { chars: 10000,   label: '一万字',   icon: SVG_BOOK   },
  { chars: 50000,   label: '五万字',   icon: SVG_BOOKS  },
  { chars: 100000,  label: '文庫1冊',  icon: SVG_MEDAL  },
  { chars: 300000,  label: '三十万字', icon: SVG_STAR   },
  { chars: 500000,  label: '五十万字', icon: SVG_STAR2  },
  { chars: 1000000, label: '百万字！', icon: SVG_TROPHY },
];
function renderBadges() {
  const totalDone = data.chapters.reduce((s,c) => s + c.translatedChars, 0);
  const row = document.getElementById('badgesRow');
  row.innerHTML = '';
  MILESTONES.forEach(m => {
    const unlocked = totalDone >= m.chars;
    const div = document.createElement('div');
    div.className = 'badge ' + (unlocked ? 'unlocked' : 'locked');
    div.innerHTML = `${unlocked ? m.icon : SVG_LOCK} ${m.label}`;
    row.appendChild(div);
  });
}

// ===== CHARACTER TYPE COUNTING =====
function countKorean(text) {
  // ハングル音節: AC00-D7A3, ハングル字母: 1100-11FF, 3130-318F
  return (text.match(/[\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F]/g) || []).length;
}
function countJapanese(text) {
  // ひらがな・カタカナ・CJK漢字（韓国語以外）
  return (text.match(/[\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF\u3400-\u4DBF]/g) || []).length;
}

// ===== CHAPTER MODAL =====
function openChapterModal(id) {
  const ch = data.chapters.find(c => c.id === id);
  if (!ch) return;
  currentChapterId = id;

  document.getElementById('modalChapterBadge').textContent = `第${ch.num}章`;
  document.getElementById('modalTitleInput').value = ch.title || '';
  document.getElementById('editorText').value = ch.editorText || '';

  updateEditorCounts(ch.editorText || '', ch.targetChars);
  document.getElementById('chapterModal').classList.add('open');

  if (ch.completed) {
    applyCompletedView(ch);
  } else {
    applyEditView();
  }

  document.getElementById('editorText').oninput = () => {
    const text = document.getElementById('editorText').value;
    const korean = countKorean(text);
    const japanese = countJapanese(text);
    const total = korean + japanese;
    if (total > 0 && korean > japanese) ch.targetChars = total;
    updateEditorCounts(text, ch.targetChars);
  };
}

function applyCompletedView(ch) {
  document.getElementById('editorText').classList.add('hidden');
  document.getElementById('finishedView').classList.add('active');
  document.getElementById('finishedView').textContent = ch.finishedText || ch.editorText || '';
  document.getElementById('editorCounts').style.display = 'none';
  document.getElementById('editorLangLabel').textContent = '完成原稿 · 読み物モード';
  document.getElementById('saveBtn').style.display = 'none';
  document.getElementById('completeBtn').style.display = 'none';
  document.getElementById('editModeBtn').style.display = '';
  document.querySelector('.chapter-modal-meta').style.display = 'none';
}

function applyEditView() {
  document.getElementById('editorText').classList.remove('hidden');
  document.getElementById('finishedView').classList.remove('active');
  document.getElementById('editorCounts').style.display = '';
  document.getElementById('editorLangLabel').textContent = '원문을 붙여넣고, 위에 번역문을 덮어쓰세요';
  document.getElementById('saveBtn').style.display = '';
  document.getElementById('completeBtn').style.display = '';
  document.getElementById('editModeBtn').style.display = 'none';
  document.querySelector('.chapter-modal-meta').style.display = '';
}

function markComplete() {
  const ch = data.chapters.find(c => c.id === currentChapterId);
  if (!ch) return;
  const text = document.getElementById('editorText').value;
  if (!text.trim()) return;

  const korean   = countKorean(text);
  const japanese = countJapanese(text);
  const total    = korean + japanese;
  ch.title        = document.getElementById('modalTitleInput').value.trim();
  ch.editorText   = text;
  ch.finishedText = text;
  if (total > 0 && korean > japanese) ch.targetChars = total;
  ch.translatedChars = ch.targetChars;
  ch.completed    = true;

  const today     = new Date().toDateString();
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (data.lastActivity !== today) {
    data.streak = data.lastActivity === yesterday ? (data.streak || 0) + 1 : 1;
    data.lastActivity = today;
  }

  saveData(data);
  renderShelves();
  applyCompletedView(ch);
}

function switchToEditMode() {
  const ch = data.chapters.find(c => c.id === currentChapterId);
  if (!ch) return;
  ch.completed = false;
  saveData(data);
  renderShelves();
  applyEditView();
}

function updateEditorCounts(text, targetChars) {
  const korean   = countKorean(text);
  const japanese = countJapanese(text);
  const total    = korean + japanese;

  document.getElementById('koreanCount').textContent   = korean.toLocaleString() + ' 字';
  document.getElementById('japaneseCount').textContent = japanese.toLocaleString() + ' 字';

  // 目標文字数表示
  const target = targetChars || total || 0;
  document.getElementById('modalTargetChars').textContent =
    target > 0 ? target.toLocaleString() + ' 字' : '— 字';

  // 進捗 = 日本語文字数 ÷ 目標文字数
  const pct = target > 0 ? Math.min(100, Math.round(japanese / target * 100)) : 0;
  document.getElementById('modalProgressFill').style.width = pct + '%';
  document.getElementById('modalPctText').textContent = pct + '%';
  document.getElementById('modalTranslatedCount').textContent = japanese.toLocaleString() + ' 字';
}

function saveChapter() {
  const ch = data.chapters.find(c => c.id === currentChapterId);
  if (!ch) return;

  const text = document.getElementById('editorText').value;
  const korean   = countKorean(text);
  const japanese = countJapanese(text);
  const total    = korean + japanese;

  ch.title      = document.getElementById('modalTitleInput').value.trim();
  ch.editorText = text;
  // 韓国語が多ければtarget更新、日本語への置き換えが進んでいればtargetを維持
  if (total > 0 && korean > japanese) ch.targetChars = total;
  ch.translatedChars = japanese;

  const today     = new Date().toDateString();
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (data.lastActivity !== today && japanese > 0) {
    data.streak = data.lastActivity === yesterday ? (data.streak || 0) + 1 : 1;
    data.lastActivity = today;
  }

  saveData(data);
  renderShelves();
  closeChapterModal();
}

function closeChapterModal() {
  document.getElementById('chapterModal').classList.remove('open');
  currentChapterId = null;
}

// ===== ADD =====
function openAddModal() {
  const next = data.chapters.length ? Math.max(...data.chapters.map(c=>c.num)) + 1 : 1;
  document.getElementById('newChapterNum').value = next;
  document.getElementById('newChapterTitle').value = '';
  document.getElementById('addModal').classList.add('open');
}
function closeAddModal() { document.getElementById('addModal').classList.remove('open'); }

function addChapter() {
  const num   = parseInt(document.getElementById('newChapterNum').value);
  const title = document.getElementById('newChapterTitle').value.trim();
  if (!num || num < 1) return alert('章番号を入力してください');
  if (data.chapters.find(c => c.num === num)) return alert(`第${num}章はすでに存在します`);
  data.chapters.push({ id: Date.now() + Math.random(), num, title, targetChars: 0, translatedChars: 0, editorText: '' });
  saveData(data); renderShelves(); closeAddModal();
}

// ===== BULK =====
function openBulkAddModal() {
  const next = data.chapters.length ? Math.max(...data.chapters.map(c=>c.num)) + 1 : 1;
  document.getElementById('bulkStart').value = next;
  document.getElementById('bulkEnd').value = next + 9;
  document.getElementById('bulkModal').classList.add('open');
}
function closeBulkModal() { document.getElementById('bulkModal').classList.remove('open'); }

function bulkAddChapters() {
  const start = parseInt(document.getElementById('bulkStart').value);
  const end   = parseInt(document.getElementById('bulkEnd').value);
  if (!start || !end || start > end) return alert('章番号の範囲を確認してください');
  if (end - start > 200) return alert('一度に追加できるのは200章までです');
  for (let i = start; i <= end; i++) {
    if (!data.chapters.find(c => c.num === i))
      data.chapters.push({ id: Date.now() + Math.random() + i, num: i, title: '', targetChars: 0, translatedChars: 0, editorText: '' });
  }
  saveData(data); renderShelves(); closeBulkModal();
}

// ===== CLOSE ON OUTSIDE CLICK =====
['chapterModal','addModal','bulkModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) {
    if (e.target === this) {
      if (id === 'chapterModal') closeChapterModal();
      else if (id === 'addModal') closeAddModal();
      else closeBulkModal();
    }
  });
});

// ===== EXPORT =====
function exportData() {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href     = url;
  a.download = `translation-tracker-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// ===== IMPORT =====
function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      // 簡易バリデーション
      if (!imported.chapters || !Array.isArray(imported.chapters)) {
        showToast('ファイルの形式が正しくありません', 'error');
        return;
      }
      data = imported;
      saveData(data);
      renderShelves();
      showToast(`${data.chapters.length} 章のデータを読み込みました ✓`);
    } catch(err) {
      showToast('読み込みに失敗しました', 'error');
    }
    // 同じファイルを再度選択できるようリセット
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ===== TOAST =====
function showToast(msg, type = 'success') {
  const existing = document.getElementById('toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'toast';
  toast.textContent = msg;
  toast.style.cssText = `
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: ${type === 'error' ? '#f0a880' : '#c4e8df'};
    color: #3a2e2a; padding: 10px 22px; border-radius: 20px;
    font-family: 'Zen Maru Gothic', sans-serif; font-size: 0.75rem;
    box-shadow: 0 4px 16px rgba(180,140,120,0.3);
    z-index: 9999; white-space: nowrap;
    animation: fadeUp 0.3s ease both;
  `;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ===== INIT =====
renderShelves();
window.addEventListener('resize', () => {
  clearTimeout(window._resizeTimer);
  window._resizeTimer = setTimeout(renderShelves, 150);
});
</script>
</body>
